[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jinpipe"
version = "0.1.0"
description = "Async, multi-worker pipeline: YouTube scraping -> sentence-safe TTS training segments"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "typer>=0.12",
    "rich>=13.7",
    "yt-dlp[default]",
]

[project.optional-dependencies]
# Silero-VAD stage. Pulls in torch (CPU build is fine).
vad = [
    "silero-vad>=5.1",
    "soundfile>=0.12",
]
# ASR + optional diarization worker.
asr = [
    "whisperx>=3.1",
    "torch>=2.2",
    "torchaudio>=2.2",
]
# DNSMOS quality scoring.
filter = [
    "onnxruntime>=1.17",
    "librosa>=0.10",
    # numba (a librosa dep) doesn't declare numpy<2.5 compat yet; without this
    # cap, uv's resolver backtracks numba all the way to 0.53.1, whose
    # llvmlite pin doesn't build on Python >=3.10.
    "numpy<2.5",
]
# NVIDIA VRAM introspection (only relevant with a CUDA GPU present).
gpu = [
    "pynvml>=11.5",
]
# `jinpipe view` - Gradio app for browsing packaged chunk audio.
viewer = [
    "gradio>=6.0,<7.0",
    "gradio_annotated_audio @ git+https://github.com/Scicom-AI-Enterprise-Organization/gradio-annotated-audio.git#subdirectory=annotatedaudio",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jinpipe = "jinpipe.cli:app"

[tool.setuptools.packages.find]
include = ["jinpipe*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
