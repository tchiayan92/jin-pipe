[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jinpipe"
version = "0.1.0"
description = "Async, multi-worker pipeline: YouTube scraping -> sentence-safe TTS training segments"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Silero-VAD stage. Pulls in torch (CPU build is fine).
vad = [
    "silero-vad>=5.1",
    "soundfile>=0.12",
]
# ASR + optional diarization worker.
asr = [
    "whisperx>=3.1",
    "torch>=2.2",
    "torchaudio>=2.2",
]
# DNSMOS quality scoring.
filter = [
    "onnxruntime>=1.17",
    "librosa>=0.10",
]
# NVIDIA VRAM introspection (only relevant with a CUDA GPU present).
gpu = [
    "pynvml>=11.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jinpipe = "jinpipe.cli:app"

[tool.setuptools.packages.find]
include = ["jinpipe*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
